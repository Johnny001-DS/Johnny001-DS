    <radialGradient id="haloA" cx="12%" cy="20%" r="60%"><stop stop-color="#BAE6FD" stop-opacity=".32"/><stop offset="1" stop-color="#BAE6FD" stop-opacity="0"/></radialGradient>
    <radialGradient id="haloB" cx="84%" cy="80%" r="55%"><stop stop-color="#BFDBFE" stop-opacity=".28"/><stop offset="1" stop-color="#BFDBFE" stop-opacity="0"/></radialGradient>
