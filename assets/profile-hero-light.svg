        <tspan x="46" y="311.50">::@%##%%%%@@%@%#%%%%%%%#%#%%####%%%%-:</tspan>
        <tspan x="46" y="318.95">:+@%%##%%%%@@@%%%%%%%%%#%%%%%%##%%%%*:</tspan>
        <tspan x="46" y="326.40">:#@%%%%%%%%@@@%%%%%%%%%#%%%%%###@%%%%:=</tspan>
        <tspan x="46" y="333.85">:%%##%%%%%%@@@%%%%%%%%%###%%###%@%%%%-:</tspan>
        <tspan x="46" y="341.30">:@%#####%%@@@@@%%%%%%%%%%%%%%%#%@%%%%+:</tspan>
        <tspan x="46" y="348.75">:%%##**#%%@@@@@%%%%%%%%%%%%%%###@@%%%*:</tspan>
        <tspan x="46" y="356.20">:@@%###%%%@@@@@@%%%%%%%%%##**+##%@@%%#:-</tspan>
        <tspan x="46" y="363.65">:@@%%%%%%@@@@@@@%%%%%%#*+++**+*#%@@%%%:-</tspan>
