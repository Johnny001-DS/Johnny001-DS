<svg width="1180" height="610" viewBox="0 0 1180 610" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Karan Badlani - Data Science, ML, and GenAI profile hero</title>
  <desc id="desc">Animated light GitHub profile banner with terminal panels, data science focus, RAG systems, healthcare NLP, financial forecasting, and cloud ML architecture.</desc>
  <defs>
    <linearGradient id="accent" x1="120" y1="70" x2="1040" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#06B6D4;#10B981;#2563EB" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#10B981;#2563EB;#06B6D4" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#2563EB;#06B6D4;#10B981" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glowA" cx="20%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="85%" cy="72%" r="62%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.02 0 0 0 0 0.45 0 0 0 0 0.72 0 0 0 .42 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#64748B" flood-opacity=".22"/>
    </filter>
    <pattern id="noise" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M4 8h1M22 5h1M44 16h1M12 31h1M38 39h1M7 45h1M27 27h1" stroke="#0F172A" stroke-opacity=".06"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="1180" height="610" rx="34"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1180" height="610" fill="#FFFFFF"/>
    <rect width="1180" height="610" fill="url(#glowA)"/>
    <rect width="1180" height="610" fill="url(#glowB)"/>
    <rect width="1180" height="610" fill="url(#noise)" opacity=".52"/>

    <circle cx="102" cy="105" r="3" fill="#06B6D4" opacity=".55">
      <animate attributeName="cy" values="105;92;105" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".18;.7;.18" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="176" r="2.5" fill="#10B981" opacity=".55">
      <animate attributeName="cy" values="176;154;176" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".22;.7;.22" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="984" cy="502" r="3" fill="#2563EB" opacity=".48">
      <animate attributeName="cx" values="984;1018;984" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;.62;.2" dur="8s" repeatCount="indefinite"/>
    </circle>

    <rect x="22" y="22" width="1136" height="566" rx="28" fill="#F8FAFC" fill-opacity=".82" stroke="#0F172A" stroke-opacity=".08" filter="url(#shadow)"/>
    <rect x="24" y="24" width="1132" height="562" rx="26" stroke="url(#accent)" stroke-opacity=".38">
      <animate attributeName="stroke-opacity" values=".14;.48;.14" dur="5s" repeatCount="indefinite"/>
    </rect>
    <path d="M56 84H420" stroke="url(#accent)" stroke-width="1" opacity=".34"/>
    <path d="M482 84H1122" stroke="url(#accent)" stroke-width="1" opacity=".34"/>

    <g transform="translate(60 72)">
      <rect width="386" height="466" rx="24" fill="#FFFFFF" fill-opacity=".76" stroke="#0F172A" stroke-opacity=".1"/>
      <rect x="18" y="18" width="350" height="430" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
      <rect x="18" y="18" width="350" height="32" rx="18" fill="#E2E8F0"/>
      <circle cx="40" cy="34" r="5" fill="#EF4444"/>
      <circle cx="58" cy="34" r="5" fill="#F59E0B"/>
      <circle cx="76" cy="34" r="5" fill="#10B981"/>
      <text x="100" y="39" class="mono" font-size="13" fill="#475569">portrait.kernel</text>

      <g filter="url(#softGlow)">
        <text x="44" y="92" class="mono" font-size="16" fill="url(#accent)" opacity="1">       .:-=+*#%%#*+=-:.
        </text>
        <text x="44" y="118" class="mono" font-size="16" fill="url(#accent)" opacity="1">    :=*%@@@@@@@@@@@@%*=:
        </text>
        <text x="44" y="144" class="mono" font-size="16" fill="url(#accent)" opacity="1">  :*@@@#=-:.    .:-=#@@@*:
        </text>
        <text x="44" y="170" class="mono" font-size="16" fill="url(#accent)" opacity="1"> =@@%-   DS / ML / AI   -%@@=
        </text>
        <text x="44" y="196" class="mono" font-size="16" fill="url(#accent)" opacity="1">#@@+   RAG systems        +@@#
        </text>
        <text x="44" y="222" class="mono" font-size="16" fill="url(#accent)" opacity="1">%@@:   forecasting        :@@%
        </text>
        <text x="44" y="248" class="mono" font-size="16" fill="url(#accent)" opacity="1">#@@+   healthcare NLP     +@@#
        </text>
        <text x="44" y="274" class="mono" font-size="16" fill="url(#accent)" opacity="1"> =@@%-   cloud ML ops    -%@@=
        </text>
        <text x="44" y="300" class="mono" font-size="16" fill="url(#accent)" opacity="1">  :*@@@#=-:.    .:-=#@@@*:
        </text>
        <text x="44" y="326" class="mono" font-size="16" fill="url(#accent)" opacity="1">    :=*%@@@@@@@@@@@@%*=:
        </text>
        <text x="44" y="352" class="mono" font-size="16" fill="url(#accent)" opacity="1">       .:-=+*#%%#*+=-:.
        </text>
      </g>

      <rect x="20" y="58" width="346" height="4" fill="#06B6D4" opacity=".12">
        <animate attributeName="y" values="58;424;58" dur="5.8s" repeatCount="indefinite"/>
      </rect>
      <text x="44" y="406" class="mono" font-size="13" fill="#475569">$ python profile.py</text>
      <rect x="220" y="394" width="9" height="18" fill="#06B6D4">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(486 72)">
      <rect width="634" height="466" rx="24" fill="#FFFFFF" fill-opacity=".76" stroke="#0F172A" stroke-opacity=".1"/>
      <rect x="22" y="22" width="590" height="422" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
      <rect x="22" y="22" width="590" height="38" rx="18" fill="#E2E8F0"/>
      <circle cx="48" cy="41" r="5" fill="#EF4444"/>
      <circle cx="68" cy="41" r="5" fill="#F59E0B"/>
      <circle cx="88" cy="41" r="5" fill="#10B981"/>
      <text x="116" y="46" class="mono" font-size="13" fill="#475569">karan@github:~/portfolio</text>

      <text x="48" y="100" class="mono" font-size="18" fill="#0284C7">$ whoami</text>
      <text x="48" y="140" class="sans" font-size="42" font-weight="800" fill="#0F172A">Karan Badlani</text>
      <text x="48" y="174" class="mono" font-size="20" fill="url(#accent)">Data Scientist | ML Engineer | GenAI Builder</text>
      <rect x="1030" y="156" width="11" height="24" fill="#10B981">
        <animate attributeName="opacity" values="1;0;1" dur=".85s" repeatCount="indefinite"/>
      </rect>

      <g class="mono" font-size="15" fill="#334155">
        <text x="48" y="220" opacity="1">location: United States
        </text>
        <text x="48" y="250" opacity="1">focus: RAG agents, healthcare NLP, financial forecasting
        </text>
        <text x="48" y="280" opacity="1">building: production-grade AI apps with measurable retrieval quality
        </text>
        <text x="48" y="310" opacity="1">email: karanbadlani001@gmail.com
        </text>
      </g>

      <g class="mono" font-size="14">
        <rect x="48" y="344" width="82" height="30" rx="15" fill="#FFFFFF" stroke="#06B6D4" stroke-opacity=".46"/>
        <text x="66" y="364" fill="#075985">Python</text>
        <rect x="142" y="344" width="56" height="30" rx="15" fill="#FFFFFF" stroke="#10B981" stroke-opacity=".46"/>
        <text x="161" y="364" fill="#047857">SQL</text>
        <rect x="210" y="344" width="66" height="30" rx="15" fill="#FFFFFF" stroke="#2563EB" stroke-opacity=".46"/>
        <text x="229" y="364" fill="#1D4ED8">AWS</text>
        <rect x="288" y="344" width="78" height="30" rx="15" fill="#FFFFFF" stroke="#06B6D4" stroke-opacity=".46"/>
        <text x="307" y="364" fill="#075985">RAG</text>
        <rect x="378" y="344" width="88" height="30" rx="15" fill="#FFFFFF" stroke="#10B981" stroke-opacity=".46"/>
        <text x="397" y="364" fill="#047857">Qdrant</text>
        <rect x="478" y="344" width="94" height="30" rx="15" fill="#FFFFFF" stroke="#2563EB" stroke-opacity=".46"/>
        <text x="497" y="364" fill="#1D4ED8">PyTorch</text>
      </g>

      <text x="48" y="414" class="mono" font-size="14" fill="#475569">selected_work = ["Healthcare RAG", "Production RAG", "Forecasting"]</text>
    </g>

    <rect x="0" y="0" width="1180" height="120" fill="url(#accent)" opacity=".06">
      <animate attributeName="y" values="-120;610" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
