<svg width="1180" height="610" viewBox="0 0 1180 610" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Karan Badlani - Data Science and GenAI terminal profile</title>
  <desc id="desc">Terminal-style GitHub profile banner with ASCII portrait, GenAI, machine learning, healthcare NLP, and financial forecasting focus.</desc>
  <defs>
