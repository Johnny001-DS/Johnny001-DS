        <rect x="250" y="344" width="54" height="28" rx="8" fill="#22D3EE" opacity=".14" stroke="#22D3EE"/><text x="266" y="363" fill="#F8FAFC">RAG</text>
        <rect x="314" y="344" width="74" height="28" rx="8" fill="#10B981" opacity=".14" stroke="#10B981"/><text x="329" y="363" fill="#F8FAFC">Qdrant</text>
        <rect x="398" y="344" width="82" height="28" rx="8" fill="#8B5CF6" opacity=".14" stroke="#8B5CF6"/><text x="413" y="363" fill="#F8FAFC">PyTorch</text>
      </g>

