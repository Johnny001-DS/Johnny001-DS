        <tspan x="46" y="214.65">         ::%@%%%*=+=-::#%%%::</tspan>
        <tspan x="46" y="222.10">          :+@@@%#=:::::#%@%*-::-</tspan>
        <tspan x="46" y="229.55">        -:-#@@@%%#=:::-%%%%%%#+::</tspan>
        <tspan x="46" y="237.00">       ::*@%%@@@%%%*=-#%%%%%%%%%=:</tspan>
        <tspan x="46" y="244.45">     ::=%@%%%%%%@@@@%#%%%%%%%%#%%+:=</tspan>
        <tspan x="46" y="251.90">    ::*@%%%%%%%%%%@@##%%#%%%%%##%%-:</tspan>
        <tspan x="46" y="259.35">   :=%@%%%%%%%%%%%%@%#%%#%#%####%%*:</tspan>
        <tspan x="46" y="266.80">  ::@@%%%%%%%%%%%%%%%%#%#%######%%%:-</tspan>
