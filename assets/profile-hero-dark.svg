      <rect x="18" y="18" width="510" height="34" rx="15" fill="#111827"/>
      <circle cx="40" cy="35" r="5" fill="#EF4444"/><circle cx="60" cy="35" r="5" fill="#F59E0B"/><circle cx="80" cy="35" r="5" fill="#10B981"/>
