        <text x="42" y="250"><tspan fill="#10B981">Focus</tspan>        RAG agents, healthcare NLP, forecasting</text>
        <text x="42" y="280"><tspan fill="#10B981">Building</tspan>     evaluated AI apps + cloud ML systems</text>
        <text x="42" y="310"><tspan fill="#10B981">Contact</tspan>      karanbadlani001@gmail.com</text>
