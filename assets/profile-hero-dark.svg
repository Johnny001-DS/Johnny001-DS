      <rect x="20" y="64" width="410" height="3" fill="#22D3EE" opacity=".18">
        <animate attributeName="y" values="64;360;64" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <text x="46" y="390" class="mono" font-size="14" fill="#94A3B8">$ render --mode signal</text>
      <rect x="226" y="377" width="9" height="20" fill="#22D3EE"><animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/></rect>
