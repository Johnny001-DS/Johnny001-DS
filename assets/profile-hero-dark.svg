    <rect width="1180" height="610" fill="url(#haloA)"/>
    <rect width="1180" height="610" fill="url(#haloB)"/>
    <rect width="1180" height="610" fill="url(#grid)"/>
    <rect x="34" y="36" width="1112" height="538" rx="24" fill="#0B1020" fill-opacity=".78" stroke="url(#stroke)" stroke-width="1.2" filter="url(#shadow)">
